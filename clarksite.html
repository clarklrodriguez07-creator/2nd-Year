<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClarkSite - Roblox Profile Showcase</title>
    <style>
      :root {
        --bg-color: #fff0f5;
        --card-bg: #ffffff;
        --accent-pink: #ffb6c1;
        --primary-pink: #ff69b4;
        --text-dark: #4a4a4a;
        --text-muted: #777777;
        --border-color: #ffe4e1;
      }

      body.dark-mode {
        --bg-color: #1a1618;
        --card-bg: #2a2226;
        --accent-pink: #d66b91;
        --primary-pink: #ff8da1;
        --text-dark: #f0f0f0;
        --text-muted: #b0a0a8;
        --border-color: #44333c;
      }

      body {
        background-color: var(--bg-color);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-dark);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .theme-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: var(--card-bg);
        border: 2px solid var(--accent-pink);
        color: var(--text-dark);
        padding: 10px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        z-index: 1000;
      }

      .card {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 30px;
        max-width: 550px;
        width: 100%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        border: 2px solid var(--border-color);
        text-align: center;
      }

      .avatar-box {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background-color: var(--border-color);
        margin: 0 auto 15px;
        border: 4px solid var(--primary-pink);
        overflow: hidden;
      }

      .avatar-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      h1 {
        color: var(--primary-pink);
        margin: 10px 0 5px;
        font-size: 26px;
      }

      .username {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 15px;
      }

      .badge {
        display: inline-block;
        background-color: var(--bg-color);
        color: var(--primary-pink);
        padding: 5px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .stats-container {
        display: flex;
        justify-content: space-around;
        background-color: var(--bg-color);
        padding: 15px;
        border-radius: 16px;
        margin-bottom: 20px;
      }

      .stat-item h3 {
        margin: 0;
        color: var(--primary-pink);
        font-size: 18px;
      }

      .stat-item p {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      /* Roblox Embedded Section */
      .embed-section {
        margin: 20px 0;
        border-radius: 16px;
        overflow: hidden;
        border: 2px solid var(--border-color);
        background: #000;
      }

      iframe {
        width: 100%;
        height: 250px;
        border: none;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        padding: 12px;
        border: none;
        border-radius: 15px;
        background-color: var(--accent-pink);
        color: #ffffff;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background-color: var(--primary-pink);
        transform: translateY(-2px);
      }

      .btn-outline {
        background-color: transparent;
        border: 2px solid var(--accent-pink);
        color: var(--primary-pink);
      }

      .btn-outline:hover {
        background-color: var(--bg-color);
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
      🌙 Dark Mode
    </button>

    <div class="card">
      <div class="avatar-box">
        <img src="c1.png" alt="Roblox Avatar" />
      </div>

      <h1>Clark</h1>
      <div class="username">@ClarkRobloxUser</div>
      <span class="badge">🎮 Roblox Enthusiast</span>

      <div class="stats-container">
        <div class="stat-item">
          <h3>250+</h3>
          <p>Friends</p>
        </div>
        <div class="stat-item">
          <h3>1.2K</h3>
          <p>Followers</p>
        </div>
        <div class="stat-item">
          <h3>15</h3>
          <p>Badges</p>
        </div>
      </div>

      <div class="embed-section">
        <iframe
          src="https://www.roblox.com"
          title="Roblox Showcase Frame"
        ></iframe>
      </div>

      <div class="actions">
        <a
          href="https://www.roblox.com/users/2590722568/profile"
          target="_blank"
          class="btn"
          >View Live Roblox Profile 🚀</a
        >
        <a href="index.html" class="btn btn-outline">← Back to Biography</a>
      </div>
    </div>

    <script>
      function toggleTheme() {
        document.body.classList.toggle("dark-mode");
        const btn = document.getElementById("themeBtn");
        if (document.body.classList.contains("dark-mode")) {
          btn.innerHTML = "☀️ Light Mode";
        } else {
          btn.innerHTML = "🌙 Dark Mode";
        }
      }
    </script>
  </body>
</html>
