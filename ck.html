<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Centered Container</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
			background: #f2f4f7;
			color: #222;
		}

		.container {
			width: min(90%, 700px);
			padding: 40px;
			text-align: center;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
		}
	</style>
</head>
<body>
	<main class="container">
		<h1>Welcome</h1>
		<p>This is a simple website with a centered container.</p>
	</main>
</body>
</html>
